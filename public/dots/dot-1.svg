  <!-- Verification Core Check -->
  <path d="M52 49 L58 55 L69 44" stroke="#1E3A8A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Avis Trust Pulse -->
  <circle cx="60" cy="85" r="4" fill="#93C5FD"/>
  <circle cx="60" cy="85" r="8" stroke="#93C5FD" stroke-width="1" opacity="0.5"/>
